[package]
name = "vuln-watch"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Poll vulnerability feeds (CISA KEV, GitHub Advisory, CVE List, RSS) and notify Discord"
license = "MIT"
repository = "https://github.com/Matuyuhi/vuln-watch"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
feed-rs = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
