id = "VWA-2026-1105-openssh-musl-password-bypass"
revision = 1
status = "active"
published = 2026-11-05
expires = 2026-12-05
severity = "critical"
confidence = "confirmed"
title = "musl libc で PAM を使わない Linux（Alpine など）の OpenSSH sshd にパスワード認証回避、10.6p2 と Alpine の更新版をすぐに適用"
summary = """
OpenSSH は 2026-11-05 に Portable OpenSSH 10.6p2 を緊急リリースし、PAM を使わずにビルド・実行された一部の Linux で sshd のパスワード認証が回避できる問題を修正した。
開発者の Damien Miller によると、影響するのは musl libc を使い PAM なしでパスワード認証する Linux（例: Alpine Linux）。glibc の Linux、PAM でパスワード認証する Linux、Linux 以外は影響を受けない。
OpenSSH 側は根本原因が OpenSSH の外にあるとしつつ sshd 側で回避策を入れた。報告の翌日に公開しており、AI による再発見が速いため長い公開猶予は危険と判断したと説明している。
Alpine Linux は同日、edge と 3.21〜3.24 などの各ブランチで openssh に修正パッチ（main/openssh: fix password authentication）を入れた更新パッケージを出した。Alpine ホストや Alpine ベースのコンテナで sshd を動かしている環境が主な対象。
2026-11-05 時点で CVE 番号は未採番、実環境での悪用の報告はない。"""
cves = []
actions = [
  "musl libc で PAM を使わない Linux（Alpine など）で sshd を動かしている場合、ただちに PasswordAuthentication=no にするか sshd を止める（OpenSSH 開発者の案内）",
  "OpenSSH 10.6p2 へ更新する。Alpine は apk upgrade で openssh を各ブランチの修正版（edge 10.6_p2-r0、3.24 10.3_p1-r2、3.23 10.2_p1-r1、3.22 10.0_p1-r11、3.21 9.9_p2-r1）にし、sshd を再起動する",
  "（独自提案）Alpine ベースのコンテナイメージで sshd を含むものは、ベースイメージを更新して再ビルド・再配備する",
  "（独自提案）更新前にパスワード認証が有効だったホストは、auth ログで不審なパスワードログインがないか確認する",
]

[[affects]]
name = "OpenSSH (musl libc, PAM なし)"
keywords = ["openssh", "sshd"]
fixed_versions = ["10.6p2"]

[[affects]]
name = "openssh (Alpine Linux)"
keywords = ["alpine linux"]
packages = ["apk:openssh"]
fixed_versions = ["10.6_p2-r0", "10.3_p1-r2", "10.2_p1-r1", "10.0_p1-r11", "9.9_p2-r1"]

