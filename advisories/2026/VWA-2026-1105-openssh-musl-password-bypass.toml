id = "VWA-2026-1105-openssh-musl-password-bypass"
revision = 3
status = "active"
published = 2026-11-05
updated = 2026-11-07
expires = 2026-12-06
severity = "critical"
confidence = "confirmed"
title = "musl libc で PAM を使わない Linux（Alpine など）の OpenSSH sshd にパスワード認証回避、10.6p2 と Alpine の更新版をすぐに適用"
summary = """
OpenSSH は 2026-11-05 に Portable OpenSSH 10.6p2 を緊急リリースし、PAM を使わずにビルド・実行された一部の Linux で sshd のパスワード認証が回避できる問題を修正した。
開発者の Damien Miller によると、影響するのは musl libc を使い PAM なしでパスワード認証する Linux（例: Alpine Linux）。glibc の Linux、PAM でパスワード認証する Linux、Linux 以外は影響を受けない。
OpenSSH 側は根本原因が OpenSSH の外にあるとしつつ sshd 側で回避策を入れた。報告の翌日に公開しており、AI による再発見が速いため長い公開猶予は危険と判断したと説明している。
Alpine Linux は同日、edge と 3.21〜3.24 などの各ブランチで openssh に修正パッチ（main/openssh: fix password authentication）を入れた更新パッケージを出した。Alpine ホストや Alpine ベースのコンテナで sshd を動かしている環境が主な対象。
その後 CVE-2026-123158 が採番され（CVSS 3.1 は 8.1）、HKCERT は概念実証コードが公開されていると報告した。Alpine Linux の公式勧告によると、攻撃は長いパスワード（257〜1024 バイト）を送る 1 回の接続で成功し、サポート終了済みの 3.16〜3.20 にも修正版が出た。
Alpine 公式クラウドイメージ（tiny-cloud、3.18.11〜3.24.3）には doas で root になれる alpine ユーザーがあり、別のアカウントに $6$ 形式のパスワードハッシュが設定されると root まで取られうる。実環境での悪用の報告は 2026-11-06 時点で確認していない。
その後、脅威情報企業 Previdian が自社センサーで悪用の試みを観測したと公表した（初観測 2026-11-06）。同社は CVE 公開から 9 時間以内に最初の試みが届き、実際の Alpine Linux と OpenSSH で動かしたハニーポットで root 権限の取得まで確認したと Help Net Security に述べている。2026-11-07 時点で CISA KEV には載っていない。"""
cves = ["CVE-2026-123158"]
actions = [
  "musl libc で PAM を使わない Linux（Alpine など）で sshd を動かしている場合、ただちに PasswordAuthentication=no にするか sshd を止める（OpenSSH 開発者の案内）",
  "OpenSSH 10.6p2 へ更新する。Alpine は apk upgrade で openssh を各ブランチの修正版（edge 10.6_p2-r0、3.24 10.3_p1-r2、3.23 10.2_p1-r1、3.22 10.0_p1-r11、3.21 9.9_p2-r1、サポート終了の 3.20 9.7_p1-r6、3.19 9.6_p1-r3、3.18 9.3_p2-r4、3.17 9.1_p1-r7、3.16 9.0_p1-r6）にし、sshd を再起動する（パッケージ更新だけでは動作中の sshd は置き換わらない、Alpine の案内）",
  "Alpine 公式クラウドイメージ（tiny-cloud、3.18.11〜3.24.3）から作ったインスタンスは、起動済みのものすべてで openssh を更新するかパスワード認証を無効にする（Alpine の案内）",
  "露出していたホストは /var/log/messages でパスワードのないアカウント（alpine、root、鍵のみのユーザー）への Accepted password を探し、doas の利用・新規ユーザー・authorized_keys を確認する。ログインを否定できなければ侵害されたものとして扱う（Alpine の案内）",
  "（独自提案）Alpine ベースのコンテナイメージで sshd を含むものは、ベースイメージを更新して再ビルド・再配備する",
]

