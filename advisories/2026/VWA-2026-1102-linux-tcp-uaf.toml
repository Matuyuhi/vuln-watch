title = "Linux カーネルの IPv4 TCP 処理の use-after-free（CVE-2026-98432）で認証不要のリモートコード実行、全ディストリのカーネル更新が必要（Ubuntu も 22.04 / 24.04 / 26.04 / 26.10 の標準カーネルが修正済み）"
summary = """
Linux カーネルの IPv4 TCP 接続要求処理に use-after-free（CVE-2026-98432）があり、Red Hat は 2026-10-30 に「Critical」の速報（RHSB-2026-016）を出した。認証不要のリモート攻撃者が競合状態を突いてリモートコード実行に至りうる。
発見者側が示した攻撃は MPTCP のリスナーを前提とするが、Go チームと AlmaLinux はいずれも、バグ自体は通常の IPv4 TCP コードにあり MPTCP を使わないシステムも修正が必要だとしている。Go 1.24 以降のプログラムは Linux で既定で MPTCP リスナーを開くため、Go 製サーバーが動く環境は特に露出しやすい。
2026-11-11 時点の Ubuntu の CVE トラッカーでは、linux パッケージが 26.10（7.3.0-10.10）、26.04 LTS（7.0.0-43.43）、24.04 LTS（6.8.0-149.149）、22.04 LTS（5.15.0-203.213）で「Fixed」になり、aws / azure / gcp / oracle などのクラウド向けカーネルも各リリースで修正版が出た。一方、22.04 の linux-hwe-6.8、24.04 の linux-hwe-6.17 / linux-hwe-7.0 などの HWE カーネルと 20.04 以前の linux は引き続き「Vulnerable」。
修正カーネルが入らない環境では、IP オプション付き IPv4 TCP パケットを落とす nftables ルールで露出を減らせるが完全な対策ではない。
2026-11-11 時点で CISA KEV には未掲載。"""
cves = ["CVE-2026-98432"]
actions = [
  "各ディストリビューションの修正カーネルを速やかに適用し、再起動する。Ubuntu は標準カーネル（linux）26.04 LTS が 7.0.0-43.43、24.04 LTS が 6.8.0-149.149、22.04 LTS が 5.15.0-203.213 以降（Ubuntu の CVE トラッカー）",
  "（独自提案）Ubuntu で HWE カーネル（22.04 の linux-hwe-6.8、24.04 の linux-hwe-6.17 / linux-hwe-7.0 など）を使っている場合はまだ修正版がないため、uname -r で実行中カーネルを確認し、修正が出るまで nftables ルールなどの緩和策を続ける",
  "修正カーネルの適用まで、Red Hat / AlmaLinux が示す nftables ルール（IP オプション付きの IPv4 TCP パケットを破棄）で露出を減らす。適用後はルールを外す",
  "Go 製サーバーでは GODEBUG=multipathtcp=0（または go.mod に godebug multipathtcp=0）で MPTCP を既定で無効化できる（Go チームの案内）",
  "（独自提案）MPTCP を使っていなければ sysctl net.mptcp.enabled=0 を設定し、ss -Mlnp で MPTCP リスナーが残っていないか確認する",
]

