id = "VWA-2026-1120-java4shell"
revision = 1
status = "active"
published = 2026-11-20
expires = 2026-12-20
severity = "critical"
confidence = "confirmed"
title = "Java（OpenJDK 17.0.6 以降・21・25・27）の Base64 デコーダにヒープ破壊（通称 Java4Shell、CVE-2026-114938）、AVX-512 VBMI 対応の x86-64 で認証不要の RCE のおそれ、Java を使う・同梱するソフトすべてに更新が必要"
summary = """
2026-11-17、Oracle と OpenJDK は Java 標準ライブラリの Base64 デコーダのメモリ破壊（CVE-2026-114938、発見者の Calif が Java4Shell と命名）を修正しました。
AVX-512 VBMI に対応した x86-64 CPU（Intel Ice Lake / AMD Zen 4 以降）で動く OpenJDK 17.0.6 以降・21・25・27 が対象で、細工した Base64 データを送るだけで、ログイン前でも任意コード実行またはプロセスの停止につながるおそれがあります（ARM64 と OpenJDK 8 / 11 は対象外）。
HTTP Basic 認証・SAML・CSRF トークンなど認証前に Base64 を復号する処理はごく一般的なため、Java で動くサーバーソフト全般（Keycloak、Jira、Confluence、Jenkins など）と、独自に JRE を同梱する製品・コンテナイメージが更新対象になります。
Red Hat と カナダ Cyber Centre は Critical と評価していますが、11-17 時点で実際の悪用は確認されていません。Ubuntu は 11-18 に OpenJDK 17 / 21 / 25 / 27 の修正版（USN-9155-1〜9158-1）を公開しています。"""
cves = ["CVE-2026-114938"]
actions = [
  "Java の実行環境を修正版（Oracle Java SE / OpenJDK 17.0.21.1・21.0.13.1・25.0.5.1・27.0.1.1、Ubuntu は USN-9155-1〜9158-1 の版）に更新し、Java のサービスを再起動する",
  "JRE を同梱する製品・アプライアンス・コンテナイメージは、ベンダーの修正版に更新するかベースイメージ更新後に再ビルドする",
  "すぐに更新できない場合は JVM を -XX:-UseBASE64Intrinsics（AVX-512 の Base64 処理だけを無効化、推奨）または -XX:UseAVX=2（x86-64 のみ。ARM64 では起動しなくなる）で起動する（暫定策。更新後は外す）",
  "インターネットに公開している Java アプリと認証サービス（Keycloak など）を優先し、CPU が AVX-512 VBMI に対応しているか（lscpu | grep avx512）を確認する",
]

