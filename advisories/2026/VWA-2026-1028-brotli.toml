id = "VWA-2026-1028-brotli"
revision = 1
status = "active"
published = 2026-10-28
expires = 2026-11-27
severity = "high"
confidence = "confirmed"
title = "Google Brotli デコーダの境界外書き込み（CVE-2026-111497、通称 Node2Shell）が悪用され KEV 入り、Brotli を同梱・利用するソフトに更新が必要"
summary = """
Google Brotli 1.0.3〜1.2.0 のデコーダに、細工した Brotli 圧縮データを展開させるだけで内部バッファの外に書き込める欠陥（CVE-2026-111497）があり、メモリ漏えい・サービス停止・任意コード実行につながり得る。修正版は Brotli 1.0.10 / 1.1.1 / 1.2.1。
Node.js は 10-21 に同梱の Brotli を直した 26.12.1 / 24.22.1 / 22.23.4 を出しており（node:zlib や fetch() での展開が対象）、PHP は 10-26 に Brotli 1.2.1 を入れた Windows 版ビルド（8.5.12-1 など）を出した。
Red Hat は影響を受けるものとして Firefox / Thunderbird、Node.js、br エンコーディングを使う Web サーバーなど、Brotli ライブラリにリンクして外部データを扱うあらゆるサービスを挙げ、.NET 8.0 も Brotli を同梱しているとしている。Ubuntu は brotli / libbrotli1 / python3-brotli を USN-8956-1（10-26）で更新した。
CISA は 10-27 に KEV（悪用が確認された脆弱性のカタログ）に追加し、対応期限を 11-10 としている。報道では公開 PoC を使った攻撃通信が観測されている。
システムの libbrotli を更新しても、Brotli を自前で同梱するランタイム・アプリ・コンテナイメージはそれぞれの更新が必要になる。"""
cves = ["CVE-2026-111497"]
actions = [
  "Ubuntu の brotli / libbrotli1 / python3-brotli を USN-8956-1 の版以降に更新し、libbrotli を使うサービスを再起動する",
  "Node.js を 26.12.1 / 24.22.1 / 22.23.4 以降に更新する（Node.js）。サポート終了した版は修正されないので、サポート中の版へ移行する",
  "Brotli を直接または同梱で使うソフトは Brotli 1.0.10 / 1.1.1 / 1.2.1 以降を含む版に更新する",
  "Windows 版 PHP は 8.5.12-1 / 8.4.27-1 / 8.3.36-1 / 8.2.35-1 のビルドに入れ替える（PHP）",
  "更新までは、信頼できない相手からの Brotli データ（Content-Encoding: br など）を受け入れたり自動展開したりしないようにし、そうしたサービスへのネットワーク到達を絞る（Red Hat）",
  "Node.js アプリでは、更新まで信頼できないデータに zlib.brotliDecompress() / zlib.createBrotliDecompress() を使わない（Red Hat）",
  "（独自提案）Docker イメージなど Brotli を同梱する成果物は、依存のロックを更新して再ビルド・再デプロイし、稼働中のものが修正版を使っているか確認する",
]

