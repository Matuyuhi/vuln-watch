title = "iOS のサンドボックス脱出「worse_query」の PoC が公開、ほかのアプリのデータを読み書きできる（iOS 27.2.1 でも未修正と研究者が主張、Apple は未発表）"
summary = """
研究者 forcequitOS が 2026-11-08 ごろ、iOS 26 / 27 のサンドボックス脱出の PoC「worse_query」を GitHub で公開した。App Group コンテナを持つアプリから、ほかのアプリのデータ領域（/var/mobile/Containers/Data/Application/* など）や、iOS 27 では一部のシステム領域にアクセスできるとしている。
README は対象を iOS 26.0 - 26.7.2 / 27.2 としているが、研究者は 11-10 に iOS 27.2.1 と iOS 27.3 beta 1 でも修正されていないと投稿している。Apple が 11-09 に出した iOS 27.2.1 / 26.7.3 のセキュリティ情報には該当する修正の記載がなく、Apple はこの件について発表していない。
この手法を使ったファイル管理アプリ（WQ Files）がすでに AltStore / SideStore などのサイドロードで配布されており、脱獄やカーネルの脆弱性なしにほかのアプリのデータを閲覧・変更・削除できる。
Binance は 11-10、ウォレットのシードフレーズ・秘密鍵・ログイン情報が悪意あるアプリに読まれるおそれがあると警告した。2026-11-14 時点で実際の攻撃や盗難は報告されていない。CVE 番号はなく、ベンダーの一次情報で確認できていない。"""
cves = []
actions = [
  "信頼できない入手元のアプリ（サイドロードや手動で署名した IPA）を削除する（Binance）",
  "iOS とすべてのアプリを公式の最新版に更新する（Binance）",
  "侵害が疑われる場合は、クリーンな端末で作った新しいウォレットへ資金を移し、有効なログインセッションをすべてリセットする（Binance）",
  "（独自提案）Apple のセキュリティ情報で修正が確認できるまで、AltStore / SideStore などでのサイドロードを控え、iPhone のアプリ内に平文の秘密情報を置かない",
]

