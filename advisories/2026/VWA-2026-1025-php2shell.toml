id = "VWA-2026-1025-php2shell"
revision = 1
status = "active"
published = 2026-10-25
expires = 2026-11-24
severity = "critical"
confidence = "confirmed"
title = "PHP の認証不要 RCE「php2shell」（CVE-2026-109618 / 109619）、Web で PHP を動かすすべての環境に更新が必要"
summary = """
PHP は 2026-10-21 に、Web リクエストを処理するすべての PHP（PHP-FPM、Apache の mod_php、php-cgi、FrankenPHP、LiteSpeed）で認証なしにリモートコード実行につながる 2 件の脆弱性（CVE-2026-109618 / CVE-2026-109619、通称 php2shell）を修正した 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35 を出し、直ちに更新するよう呼びかけた。
mod_php ではアプリのコードが動く前に未認証のリクエストで攻撃できることが実証されており、カナダ Cyber Centre は PoC の存在を報じる公開情報を確認している（実際の悪用は現時点で未確認）。
PHP は多数の Web アプリ・アプライアンス・コンテナに組み込まれており、8.1 以前は PHP プロジェクトの更新対象外のため、ディストリビューションや製品ベンダーのバックポートを確認する必要がある。
10-23 には 10-21 の更新で直っていない別の RCE（CVE-2026-115560）が告知され、次の通常リリースまでの緩和策として session.upload_progress.enabled=0 が推奨された。"""
cves = ["CVE-2026-109618", "CVE-2026-109619"]
actions = [
  "PHP を 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35 以降に更新する。ディストリビューションの PHP は配布元の修正版（Ubuntu は USN-8948-1 / USN-8948-2）に更新する",
  "8.1 以前を使っている場合は、ベンダーのバックポートを確認するか、サポート中の版へ移行する",
  "CVE-2026-115560 の修正が出るまで session.upload_progress.enabled=0 を設定する（10-21 の緩和策として既に設定済みならそのまま維持する）",
  "インターネットに公開した PHP サーバーと、PHP を同梱するサードパーティ製品・アプライアンス・コンテナを優先して洗い出す",
]

