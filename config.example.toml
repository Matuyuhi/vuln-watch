# vuln-watch configuration
# Installed to /etc/vuln-watch/config.toml. Secrets go in /etc/vuln-watch/env.

[discord]
# "dm": bot direct message (DISCORD_BOT_TOKEN)
# "webhook": channel webhook (DISCORD_WEBHOOK_URL)
mode = "dm"
# Recipient user ID. DISCORD_USER_ID overrides this.
user_id = "000000000000000000"

[rules]
# Items in CISA KEV are always urgent.
kev_urgent = true
# Strong watch match (package, product or title): urgent if CVSS >= this or unscored,
# digest otherwise. Description-only matches always go to the digest.
watch_urgent_cvss = 7.0
# Without a watch match: urgent if CVSS >= this. 0 disables.
urgent_cvss = 0
# Without a watch match: digest if CVSS >= this. 0 disables.
digest_cvss = 9.0
# Ignore items containing these words, unless they are in KEV or match a watch entry.
exclude_keywords = ["wordpress", "plugin for wordpress", "sourcecodester", "code-projects"]

[runtime]
# Urgent messages per run; the rest go to the digest.
max_urgent_per_run = 10
# Warn after this many consecutive failures of one source.
alert_after_failures = 5
http_timeout_secs = 30
# Pinged after every successful run. HEARTBEAT_URL overrides this.
# heartbeat_url = "https://hc-ping.com/..."
# Send the digest even when it is empty.
digest_send_empty = true
# CVE records fetched per run; the remainder is processed on later runs.
cvelist_max_records = 300

# Match Ubuntu Security Notices (kind = "usn") against installed packages.
#   installed, older than the fix  -> urgent
#   installed, already patched     -> already_fixed ("digest" or "ignore")
#   not installed                  -> ignored, even if it matches a watch entry
# Set enabled = false on systems without dpkg.
[installed]
enabled = true
# dpkg_status = "/var/lib/dpkg/status"
# release = "noble"   # default: read from /etc/os-release
already_fixed = "digest"

# Watch list
#   keywords  whole-word, case-insensitive match on title, products and description
#   packages  exact package name (Maven: group:artifact)
#   sources   limit to these source names (default: all)
#   urgent    false = matches only go to the digest
# With neither keywords nor packages, name is used as the keyword.

# Server
[[watch]]
name = "nginx"

# Dozens of kernel CVEs are published daily. Patches for the installed kernel are
# covered by [installed]; exploited ones by KEV.
[[watch]]
name = "Linux kernel"
keywords = ["linux kernel"]
sources = ["oss-security"]

[[watch]]
name = "OpenSSH"
keywords = ["openssh"]

[[watch]]
name = "OpenSSL"
keywords = ["openssl"]

[[watch]]
name = "sudo"

[[watch]]
name = "glibc"
keywords = ["glibc", "gnu c library"]

[[watch]]
name = "systemd"

[[watch]]
name = "fail2ban"

# Mobile platforms publish monthly batches; exploited ones arrive via KEV.
[[watch]]
name = "Android"
keywords = ["google android", "android os"]
urgent = false

[[watch]]
name = "Samsung Mobile"
keywords = ["samsung mobile"]
urgent = false

[[watch]]
name = "Apple iOS"
keywords = ["ios and ipados", "apple ios", "xcode"]
urgent = false

[[watch]]
name = "Chrome / WebView"
keywords = ["google chrome", "android webview", "chromium"]
urgent = false

# Libraries
[[watch]]
name = "OkHttp"
keywords = ["okhttp"]
packages = ["com.squareup.okhttp3:okhttp", "com.squareup.okhttp:okhttp"]

[[watch]]
name = "Ktor"
keywords = ["ktor"]
packages = ["io.ktor:ktor-server-core", "io.ktor:ktor-client-core", "io.ktor:ktor-http"]

[[watch]]
name = "Kotlin"
packages = ["org.jetbrains.kotlin:kotlin-stdlib", "org.jetbrains.kotlin:kotlin-compiler"]

[[watch]]
name = "Gradle / AGP"
keywords = ["gradle"]
packages = ["com.android.tools.build:gradle"]

[[watch]]
name = "tokio"
packages = ["tokio"]

[[watch]]
name = "rustls"
packages = ["rustls"]

# Sources
#   kind  kev | ghsa | cvelist | usn | feed | advisory
#   mode  filter (apply rules, default) | urgent | digest
# Without any [[source]], kev, ghsa and cvelist are enabled.

[[source]]
kind = "kev"

[[source]]
kind = "ghsa"

[[source]]
kind = "cvelist"

# Release defaults to [installed].release; set release = "noble" to use it on its own.
[[source]]
kind = "usn"
name = "ubuntu-usn"

[[source]]
kind = "feed"
name = "oss-security"
url = "https://seclists.org/rss/oss-sec.rss"
ignore_title_prefixes = ["Re:"]

[[source]]
kind = "feed"
name = "nginx-releases"
url = "https://github.com/nginx/nginx/releases.atom"
mode = "digest"

# Advisories from the scheduled Claude research (README: Claude advisories).
# Defaults: url = "https://github.com/Matuyuhi/vuln-watch", branch = "advisories".
# [[source]]
# kind = "advisory"
