# Fetch every source from the real internet with --dry-run, to catch upstream
# format changes early. Nothing is sent to Discord.
name: Live smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * 0" # weekly, Monday 06:17 JST

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Dry run against live sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_LOG: info
        run: |
          set -o pipefail
          ./target/release/vuln-watch --config config.example.toml run --dry-run --limit 5 --strict | tee out.txt
          # Surface the per-item decisions as a run annotation (readable from the checks API).
          {
            echo "## Dry-run decisions"
            echo '```'
            grep -E '^\[' out.txt || echo "(no items)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          msg=$(grep -E '^\[' out.txt | head -40 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::notice title=dry-run decisions::${msg:-no items}"
