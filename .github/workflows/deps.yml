# cargo-deny (configured in deny.toml)
# - advisories: RustSec vulnerabilities, unmaintained and yanked crates
# - bans, licenses, sources
# Runs daily as well, since new advisories appear without code changes.
name: Dependencies

on:
  push:
    branches: [main]
    paths: ["**/Cargo.toml", "Cargo.lock", "deny.toml", ".github/workflows/deps.yml"]
  pull_request:
    paths: ["**/Cargo.toml", "Cargo.lock", "deny.toml", ".github/workflows/deps.yml"]
  schedule:
    - cron: "41 22 * * *" # daily, 07:41 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
          arguments: --locked
