# Build and publish a GitHub release.
#
# Triggered by pushing a `vX.Y.Z` tag (created by scripts/release.sh).
# Running it manually (workflow_dispatch) builds and uploads the archives as
# workflow artifacts only, without creating a release: use it to check the
# pipeline before tagging.
#
# Jobs:
#   verify   tag matches Cargo.toml, fmt/clippy/test pass, notes from CHANGELOG.md
#   build    one archive per target, smoke-tested with --version
#   publish  SHA256SUMS, build provenance attestation, GitHub release
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Resolve version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "vuln-watch") | .version')
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [[ "$version" == *-* ]] && pre=true || pre=false
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        run: scripts/changelog-section.sh "${{ steps.version.outputs.version }}" > release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          # Built on the oldest supported runner so the binary runs on glibc >= 2.35
          # (Ubuntu 22.04, Debian 12).
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        run: |
          out=$(target/${{ matrix.target }}/release/vuln-watch --version)
          echo "$out"
          [[ "$out" == "vuln-watch ${{ needs.verify.outputs.version }}" ]]

      - name: Package
        run: |
          name=vuln-watch-v${{ needs.verify.outputs.version }}-${{ matrix.target }}
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/vuln-watch "dist/$name/"
          cp config.example.toml README.md README.ja.md CHANGELOG.md LICENSE "dist/$name/"
          cp -r deploy "dist/$name/"
          tar -C dist --owner=0 --group=0 -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [verify, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum vuln-watch-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/vuln-watch-*.tar.gz

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          [[ "${{ needs.verify.outputs.prerelease }}" == true ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md \
            "${flags[@]}" \
            dist/vuln-watch-*.tar.gz dist/SHA256SUMS
