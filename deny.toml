# cargo-deny configuration. Run locally with `cargo deny check`;
# CI runs it from .github/workflows/deps.yml.
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
# Only the released Linux targets (ignore Windows/macOS-only dependencies).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = true

# RustSec advisories
[advisories]
# Vulnerabilities, unsound and yanked crates are errors. Unmaintained crates are
# errors only for direct dependencies.
unmaintained = "workspace"
yanked = "deny"
# Accepted advisories, with a reason:
# { id = "RUSTSEC-0000-0000", reason = "affected feature is not used" }
ignore = []

# Licenses
[licenses]
# Permissive licenses compatible with a statically linked MIT binary.
# Copyleft licenses fail the check.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla root certificates)
]
confidence-threshold = 0.9

# Banned crates and duplicates
[bans]
# Duplicate versions are often unavoidable in transitive dependencies.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    # TLS is rustls only.
    { crate = "openssl-sys", reason = "use rustls" },
    { crate = "native-tls", reason = "use rustls" },
]

# Sources
[sources]
# crates.io only; no git or other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
